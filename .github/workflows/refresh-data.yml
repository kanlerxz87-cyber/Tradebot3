name: Kalshi data refresh

# Refreshes the dashboard's public-data snapshot straight from Kalshi's official
# unauthenticated Trade API. The published JSON is committed back, so GitHub
# Pages always serves a timestamped, real snapshot instead of hard-coded numbers.

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (UTC)
  workflow_dispatch:
  push:
    # Default branch only, now that the pipeline is merged and exercised.
    branches: ["main"]
    paths:
      - "scripts/fetch_kalshi_data.py"
      - "scripts/legacy_claims.json"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: kalshi-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official Kalshi public data
        run: |
          set -o pipefail
          python3 scripts/fetch_kalshi_data.py --demo-check --audit-legacy 2>&1 | tee /tmp/fetch.log

      - name: Site + module checks (no network)
        run: |
          python3 scripts/verify_site.py
          node --version
          node scripts/test_modules.mjs

      - name: Add the audited layer to the snapshot
        run: |
          # The fetch step writes measured data; this step adds the blocks the
          # site promises (official link status, measured cadence, resolution
          # window, warning summary, alert price basis). It must run AFTER the
          # data is fetched and BEFORE the commit, otherwise the next refresh
          # silently drops them.
          python3 scripts/enrich_snapshot.py
          python3 scripts/enrich_snapshot.py --check

      - name: Page render smoke test (jsdom, optional dependency)
        run: |
          # jsdom is installed here only; it is deliberately not a project
          # dependency, so the published site stays dependency-free.
          npm install --no-save --no-audit --no-fund jsdom
          node scripts/render_pages.mjs

      - name: Validate generated JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          snap = json.loads(pathlib.Path("assets/data/snapshot.json").read_text())
          audit = json.loads(pathlib.Path("assets/data/legacy-audit.json").read_text())
          stats = snap["stats"]
          print("generated_at:", snap["generated_at"])
          print("stats:", json.dumps(stats, indent=2))
          print("legacy claims found:", audit["claims_found_in_api"], "/", audit["claims_checked"])
          assert snap["markets"], "snapshot has no markets"
          assert "official_links" in snap and snap["official_links"]["rows"], "link check missing"
          assert "refresh_cadence" in snap, "refresh cadence missing"
          for ev in snap["events"]:
              assert ev.get("markets_published") == len(ev.get("market_tickers") or []), ev.get("event_ticker")
          assert audit["claims_checked"] == 29, "legacy audit incomplete"
          sources = [m for m in snap["markets"] if not m.get("api_url")]
          assert not sources, "every market needs an official API source URL"
          for m in snap["markets"]:
              assert m["topic"] in ("gas-prices", "elections", "culture", "crypto", "golf"), m
          print("validation OK")
          PY

      - name: Capture failure log (diagnostics)
        if: failure()
        run: |
          mkdir -p assets/data
          tail -200 /tmp/fetch.log > assets/data/build-error.log || true
          git config user.name "tradebot3-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/build-error.log
          git commit -m "ci: capture data build error" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Record this run in the refresh history
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          path = pathlib.Path("assets/data/refresh-history.json")
          runs = []
          if path.exists():
              try:
                  runs = json.loads(path.read_text())
              except Exception:
                  runs = []
          if not isinstance(runs, list):
              runs = runs.get("runs", [])
          run = {
              "at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "event": "${{ github.event_name }}",
              "sha": "${{ github.sha }}"[:12],
              "run_id": "${{ github.run_id }}",
          }
          runs.append(run)
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(runs[-500:], indent=0))
          print("recorded", run)
          PY

      - name: Commit refreshed snapshot
        if: success()
        run: |
          git config user.name "tradebot3-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          if git diff --cached --quiet; then
            echo "No data change this run."
          else
            git commit -m "data: refresh official Kalshi snapshot ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
